et','🀄 Hán tự → Việt'],['viethan','🇻🇳 Việt → Hán'],['pinyin','🔤 Chọn Pinyin'],['fill','🧩 Điền từ vào câu'],['sentence','✍️ Dịch câu Việt → Trung'],['paragraph','📝 Viết đoạn văn'],['grammar','📚 Luyện ngữ pháp'],['listen','🎧 Luyện nghe'],['speak','🎙️ Luyện nói']];let mode='flash',pos=0,score=0,selection=-1,submitted=false,flipped=false,typed='',recorded='',known=new Set(),missed=new Set();const $=x=>document.getElementById(x),esc=x=>String(x).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');const normalize=x=>String(x).replace(/[\s，。！？、,.!?；;：:]/g,'').trim();function say(s){if(!('speechSynthesis'in window)){alert('Trình duyệt không hỗ trợ đọc tiếng Trung.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='zh-CN';u.rate=.78;speechSynthesis.speak(u)}function setMode(m){mode=m;pos=0;score=0;selection=-1;submitted=false;flipped=false;typed='';recorded='';drawMenu();draw()}function drawMenu(){$('menu').innerHTML=modes.map(([id,label])=>`<button class="mode ${mode===id?'active':''}" onclick="setMode('${id}')">${label}</button>`).join('')};function optionsFor(correct,pool,seed){let other=pool.filter(x=>x!==correct),out=[correct];for(let i=0;i<3;i++){let k=(seed*7+i*11)%other.length;out.push(other.splice(k,1)[0])}return out.sort((a,b)=>((a.charCodeAt(0)+seed)%7)-((b.charCodeAt(0)+seed)%7))}function current(){return W[pos%20]}function sentence(){return S[pos%30]}function paragraph(){let a=S[pos%30],b=S[(pos+7)%30],c=S[(pos+13)%30];return {s:[a.s,b.s,c.s].join(' '),t:[a.t,b.t,c.t].join(' ')}}function grammar(){let a=[{s:'我可以坐吗？',t:'Tôi có thể ngồi không?',g:'可以 + động từ: xin phép'},{s:'请等一下。',t:'Vui lòng đợi một chút.',g:'Động từ + 一下: hành động ngắn'},{s:'请给我一杯茶。',t:'Vui lòng cho tôi một cốc trà.',g:'给 + người + vật: hai tân ngữ'},{s:'我问老师一个问题。',t:'Tôi hỏi giáo viên một câu hỏi.',g:'问 + người + nội dung: hai tân ngữ'},{s:'你可以看一下。',t:'Bạn có thể xem một chút.',g:'可以 + V + 一下'}];return a[pos%5]}function chState').textContent='Nhận diện: '+recorded};r.onerror=e=>$('speechState').textContent='Lỗi micro: '+e.error;r.start()}function flip(){flipped=!flipped;draw()}function mark(ok){(ok?known:missed).add(pos%20);next()}function draw(){let n=mode==='flash'?20:30;if(pos>=n){$('game').innerHTML=`<h2>🎉 Hoàn thành!</h2><p>Chế độ: ${modes.find(x=>x[0]===mode)[1]}</p><h1>${mode==='flash'?`Đã xem ${n} thẻ · Nhớ ${known.size} từ`:`${score}/${n} câu`}</h1><button class="primary" onclick="setMode('${mode}')">🔄 Chơi lại</button><button class="secondary" onclick="setMode('flash')">Ôn flashcard</button>`;return}let w=current(),s=sentence(),p=paragraph(),g=grammar();let h=`<div class="stats"><span class="stat">${modes.find(x=>x[0]===mode)[1]}</span><span class="stat">${mode==='flash'?'Thẻ':'Câu'} ${pos+1}/${n}</span><span class="stat">${mode==='flash'?`Đã nhớ: ${known.size}`:`Điểm: ${score}`}</span></div><div class="bar"><div style="width:${pos/n*100}%"></div></div>`;if(mode==='flash'){h+=`<p class="muted">Nhấn vào thẻ để lật. Mỗi thẻ có phát âm và câu ví dụ.</p><div class="cardface" onclick="flip()">${flipped?`<div class="large han">${w.h}</div><div>${esc(w.p)}</div><h2 class="answer">${esc(w.v)}</h2><p class="han">${w.s}</p><p class="answer">${w.t}</p>`:`<div class="large han">${w.h}</div><p class="muted">Chạm để xem nghĩa, pinyin và ví dụ</p>`}</div><div class="actions"><button class="secondary" onclick="say(W[pos%20].h)">🔊 Nghe từ</button><button class="secondary" onclick="say(W[pos%20].s)">🔊 Nghe câu</button><button class="secondary" onclick="mark(false)">❌ Chưa nhớ</button><button class="primary" onclick="mark(true)">✓ Đã nhớ</button></div>`}else{let answer='',question='',hint='';if(mode==='hanviet'){question=`<div class="han large">${w.h}</div><p>Chọn nghĩa tiếng Việt chính xác:</p>`;answer=w.v}else if(mode==='viethan'){question=`<h2>${w.v}</h2><p>Chọn Hán tự đúng:</p>`;answer=w.h}else if(mode==='pinyin'){question=`<div class="han large">${w.h}</div><p>Chọn phiên âm Pinyin đúng anviet','viethan','pinyin','fill','grammar'].includes(mode)?getOptions()[selection]===answer:normalize(mode==='speak'?recorded:typed)===normalize(answer));h+=`<div class="feedback"><strong>${correct?'✓ Chính xác!':'✦ Hãy ôn lại đáp án'}</strong><div class="answer"><b>Đáp án mẫu:</b> <span class="han">${esc(answer)}</span></div>${mode==='paragraph'?'<div>Chấm theo từ khóa, không thay thế việc đánh giá ngữ pháp và diễn đạt.</div>':''}${mode==='speak'?`<div>Bạn nói: ${esc(recorded||'(chưa ghi nhận)')}</div>`:''}${mode==='grammar'?`<div>${g.g}</div>`:''}${mode==='sentence'||mode==='listen'||mode==='speak'?`<div>Nghĩa: ${s.t}</div>`:''}</div>`}h+=`<div class="actions"><button class="secondary" onclick="prev()" ${pos===0?'disabled':''}>← Câu trước</button>${!submitted?`<button class="primary" onclick="check()">Kiểm tra</button>`:`<button class="primary" onclick="next()">${pos===29?'Xem kết quả':'Câu tiếp →'}</button>`}<button class="secondary" onclick="next()">Bỏ qua →</button></div>`}h+=`<p class="footer">Phạm vi: 20 từ vựng Bài 13 · 可以 · V + 一下 · 给/问 + hai tân ngữ. Mỗi chế độ 30 lượt luyện tập; các từ được lặp lại để củng cố.</p>`;$('game').innerHTML=h};drawMenu();draw();
